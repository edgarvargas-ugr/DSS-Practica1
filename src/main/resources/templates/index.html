<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MarketPlace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">MarketPlace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menu" aria-controls="menu" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <div class="d-flex">
                    <a class="btn btn-outline-light" th:href="@{/login}"
                       sec:authorize="!isAuthenticated()">Iniciar sesión</a>

                    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                        <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="p-5 mb-4 bg-white border rounded-3 text-center shadow-sm">
            <h1 class="display-5 fw-bold">¡Bienvenidos al MarketPlace!</h1>
            <p class="lead text-muted">Explora nuestros productos y arma tu carrito de compras.</p>

            <div class="d-flex justify-content-center gap-2 mt-4">
                <a class="btn btn-primary btn-lg" th:href="@{/products}" sec:authorize="!hasRole('ADMIN')">Ver productos</a>
                <a class="btn btn-primary btn-lg" th:href="@{/products}" sec:authorize="hasRole('ADMIN')">Administrar/ver productos</a>
                <a class="btn btn-outline-secondary btn-lg" th:href="@{/cart}">Ir al carrito</a>
                <a class="btn btn-outline-secondary btn-lg" th:href="@{/export}" sec:authorize="hasRole('ADMIN')">Exportar productos</a>
            </div>
        </div>
    </div>
</body>
</html>
