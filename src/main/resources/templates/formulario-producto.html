<html xmlns:th="http://www.thymeleaf.org">
<body>
    <h1>Crear producto</h1>

    <form th:action="@{/products}" th:object="${producto}" method="post">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}"><br>

        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}"><br>

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/products}">Cancelar</a>
</body>
</html>
