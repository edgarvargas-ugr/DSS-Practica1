<html xmlns:th="http://www.thymeleaf.org">
<body>
    <h1 th:text="${producto.id == null} ? 'Crear producto' : 'Editar producto'">Crear producto</h1>
    
    <h2 th:if="${isProducto == false}"> No fue encontrado ese ID de producto para edición </h2>

    <form th:action="@{/products}" th:object="${producto}" method="post">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}"><br>

        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}"><br>
        
        <input type="hidden" th:field="*{id}">
    	<input type="hidden" name="_method" value="put" th:if="${producto.id != null}">

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/products}">Cancelar</a>
</body>
</html>
