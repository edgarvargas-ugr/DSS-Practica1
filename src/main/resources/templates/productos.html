<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">MarketPlace</a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">Ir al carrito</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="mb-4">Lista de productos</h1>

        <div class="card shadow-sm mb-3">
		    <div class="card-body py-2 px-3">
		        <div class="row g-3">
		
		            <!-- Filtro 1: por nombre -->
		            <div class="col-md-5">
		                <form th:action="@{/products/busqueda}" method="get">
		                    <label class="form-label small fw-semibold mb-1">Buscar por nombre</label>
		                    <div class="input-group input-group-sm">
		                        <input type="text" class="form-control" name="nombre" th:value="${nombre}"
		                               placeholder="Nombre del producto">
		                        <button type="submit" class="btn btn-primary">Buscar</button>
		                    </div>
		                </form>
		            </div>
		
		            <div class="col-md-1 d-flex align-items-center justify-content-center fw-bold text-muted">
		                O
		            </div>
		
		            <!-- Filtro 2: por rango de precio -->
		            <div class="col-md-6">
		                <form th:action="@{/products/busqueda}" method="get">
		                    <label class="form-label small fw-semibold mb-1">Buscar por rango de precio</label>
		                    <div class="input-group input-group-sm">
		                        <input type="number" step="0.01" class="form-control" name="precioMenor"
		                               th:value="${precioMenor}" placeholder="Precio menor">
		                        <input type="number" step="0.01" class="form-control" name="precioMayor"
		                               th:value="${precioMayor}" placeholder="Precio mayor">
		                        <button type="submit" class="btn btn-primary">Buscar</button>
		                    </div>
		                </form>
		            </div>
		        </div>
		
		       <div class="mt-2 d-flex align-items-center gap-2 small"
				     th:if="${nombreFiltro != null || precioMenorFiltro != null || precioMayorFiltro != null}">
				    <div>
				        Resultados:
				        <span class="badge text-bg-secondary" th:if="${nombreFiltro != null}"
				              th:text="|Nombre: ${nombreFiltro}|"></span>
				        <span class="badge text-bg-info" th:if="${precioMenorFiltro != null}"
				              th:text="|Precio menor: ${precioMenorFiltro}|"></span>
				        <span class="badge text-bg-info" th:if="${precioMayorFiltro != null}"
				              th:text="|Precio mayor: ${precioMayorFiltro}|"></span>
				    </div>
				    <a class="btn btn-outline-secondary btn-sm py-0" th:href="@{/products}">Limpiar</a>
				</div>
		    </div>
		</div>

        <a class="btn btn-primary" th:href="@{/products/product-form}" sec:authorize="hasRole('ADMIN')">Crear Producto</a>
		
        <div class="alert alert-warning mt-3" sec:authorize="!hasRole('ADMIN')">
            Si quieres adicionar productos, inicia sesión como administrador
        </div>
        
        <div class="card shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td th:text="${p.precio}"></td>
                            <td class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/products/product-form/{id}(id=${p.id})}"
                                   sec:authorize="hasRole('ADMIN')">Editar</a>
                                <a class="btn btn-sm btn-outline-danger"
                                   th:href="@{/products/delete/{id}(id=${p.id})}"
                                   sec:authorize="hasRole('ADMIN')">Eliminar</a>
                                <a class="btn btn-sm btn-success"
                                   th:href="@{/cart/add/{id}(id=${p.id})}">Añadir al carrito</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
