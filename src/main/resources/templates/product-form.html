<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">MarketPlace</a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <h1 class="h3 mb-3"
                    th:text="${producto.id == null} ? 'Crear producto' : 'Editar producto'">Crear producto</h1>

                <div class="alert alert-warning" th:if="${isProducto == false}">
                    No fue encontrado ese ID de producto para edición
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <form th:action="@{/products}" th:object="${producto}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre:</label>
                                <input type="text" class="form-control" th:field="*{nombre}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Precio:</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{precio}">
                            </div>

                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" name="_method" value="put" th:if="${producto.id != null}">

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                                <a class="btn btn-outline-secondary" th:href="@{/products}">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
